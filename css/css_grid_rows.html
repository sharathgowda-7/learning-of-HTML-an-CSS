<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid_rows</title>
    <style> 
        .grid{
            display: grid;
            grid-template-rows: 0.55fr 3fr 0.5fr;
            grid-template-columns: repeat(2,2fr);
            grid-auto-rows: 2fr;
        }

         .item{
            padding: 3rem;
            border:#ccc solid;
            background: #da3232;
            font-size: 1.3rem;
            font-weight:bold;
            text-align: center;
            justify-content: space-between;



        }



    </style>
</head>
<body>
    <div class="grid">
        <div class="item"> item-1</div>
        <div class="item"> item-2</div>
        <div class="item"> item-3</div>
        <div class="item"> item-4</div>
        <div class="item"> item-5</div>
        <div class="item"> item-6</div>

    </div>
</body>
</html>
