<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex_box_properties</title>
    <style>
        #container {
            background-color: #f1f1f1;
            display: flex;
            justify-content: space-between;

        }

        #item1 {
            background-color: red;
            flex: 1;  
            text-align: center;
            margin: 10px;
        }

        #item2 {
            background-color: green;
            flex: 1;  
            text-align: center;
        }

        #item3 {
            background-color: blue;
            flex: 1;  
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="item1"><h3>item1</h3></div>
        <div id="item2"><h3>item2</h3></div>
        <div id="item3"><h3>item3</h3></div>
    </div>
</body>
</html>
