<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alignment and justification</title>
    <style>

        #container {
            background-color: #555;
            display: flex;
              /* justify-content: space-between; align horizontally */

    </div>
