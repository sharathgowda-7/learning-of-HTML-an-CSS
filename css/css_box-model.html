<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-model</title>
    <style>
        #box-1 {
            width: 500px;
            height: 200px;
            background-color: red;
            padding: 20px;
            border-style: solid;
            border-width: 10px;
            margin-bottom: 20px;
        }

        #box-2 {
            width: 500px;
            height: 200px;
            background-color: blue;
            padding: 20px;
            border-style: dashed;
            border-width: 5px;
            margin-bottom: 20px;
        }

        #box-3 {
            width: 500px;
            height: 200px;
            background-color: green;
            padding: 20px;
            border-style: dotted;
            border-width: 8px;
        }
    </style>
        
</head>
<body>
    <div id="box-1" > this is the  box-1</div>
    <div id="box-2">this is the  box-2</div>
    <div id="box-3">this is the  box-3</div>
</body>
</html>
