<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About_colors</title>
  <style>
    h1 {
      color: red;
    }

    h2 {
      color: rgb(0, 0, 255);
      /* Blue color using RGB */
    }

    h3 {
      color: #0707AF;
      /* Blue color using Hexadecimal */
    }

    #box-1 {
      background-color: cyan;
      color: white;
      /* Text color */
      padding: 20px;
      border-style: dotted;
      border-width: 12px;
      margin-bottom: 20px;
    }

    #box-2 {

      background-color: #00FF00;
      /* Green color using Hexadecimal */
      color: black;
      /* Text color */
      padding: 20px;
      border-style: solid;
      border-width: 2px;
      border-radius: 10px;
      /* Rounded corners */
      margin-bottom: 20px;
    }

    #box-3 {
      background-image: url('https://www.w3schools.com/css/img_lights.jpg');
      background-color: hsl(240, 100%, 50%); /* Blue color using HSL */
      color: white;
      /* Text color */
      height: 300px;
      width: 500px;
      padding: 2px;
      border-style: dashed;
      background-repeat: no-repeat;
      background-position: center,center;
        }
  </style>
</head>

<body>
  <h1> heaing 1</h1>
  <h2> heading 2</h2>
  <h3> heading 3</h3>

  <div id="box-1">
    <h1>Box 1</h1>
    <p> This is a sample paragraph inside Box 1.</p>
  </div>

  <div id="box-2">
    <h2>Box 2</h2>
    <p> This is a sample paragraph inside Box 2.</p>
  </div>

  <div id="box-3">
    <h3>Box 3</h3>
    <p> This is a sample paragraph inside Box 3.</p>
  </div>

  <div id="box-4">
    <h3>Box 4</h3>
    <p> This is a sample paragraph inside Box 4.</p>
  </div>

</body>

</html>
