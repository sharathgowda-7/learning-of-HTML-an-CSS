<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list and table</title>
</head>
<body>
    <ul>
        <li>item 1</li>
        <ul>
            <li>subitem 1</li>
            <li>subitem 2</li>
        </ul>
        <li>item 2</li>
        <li>item 3</li>
    </ul>

    <ol>
        <li>apple</li>
        <li>banana</li>
        <li>orange</li>
    </ol>


    <table>
        <thead>
            <tr>
                <th>first_name</th>
                <th>last_name</th>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td>sharath</td>
                <td>gowda</td>  
            </tr>

            <tr>
                <td>ram</td>
                <td>prasad</td>
            </tr>    
        </tbody>
    </table>
</body>
</html>
