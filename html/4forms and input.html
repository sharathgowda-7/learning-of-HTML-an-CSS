    <title>html forms</title>

<body>

        <label for="name">Name:</label>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>

        <label for="birthdate">Birthdate:</label>

        <!----select-->
